server:
  http_addr: ":8090"

dependencies:
  portfolio_service_grpc: "127.0.0.1:50051"
  order_service_grpc: "127.0.0.1:50051"
  # control-panel-service owns hosted runtime routing, self-hosted proxying,
  # runtime credentials, and market-data control-plane RPCs.
  control_panel_service_grpc: "127.0.0.1:50054"
  # Notification Management REST only proxies core-service notification RPCs.
  # Kafka/Telegram delivery is owned by core-service, not quant-handler.

auth:
  # 生产环境推荐用 env var AUTH_JWT_SECRET 覆盖
  jwt_secret: "dev-secret-change-me"
  cors_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

docs:
  # Empty keeps the business API healthy while document endpoints report unavailable.
  root: ""
  privileged_user_ids: []

docs_assistant:
  enabled: false
  # OPENAI_BASE_URL can override this only for tests or an explicitly compatible endpoint.
  base_url: "https://api.openai.com/v1"
  # Set OPENAI_DOCS_MODEL and OPENAI_API_KEY in the process environment before enabling.
  model: ""
  requests_per_minute: 6

log:
  output_dir: "./logs"
  local_file:
    enabled: true
  kafka:
    enabled: true
    brokers: ["127.0.0.1:9092"]
    topic: "app-logs"
    topic_prefix: "app-logs"
  tracing:
    enabled: true
    endpoint: "http://127.0.0.1:4318"
    service_name: "quant-handler"
